version: 2

# Gold: the dimensional model (star schema) that analysts and dashboards query.
#   dimensions/  descriptive context: who, what, when (dim_*)
#   facts/       measurable events at a declared grain (fct_*)
#   marts/       curated answers to one business question (mart_*)
#
# Dimensions:
#   - Surrogate key (<entity>_key) = md5 of the natural key: stable across rebuilds, so a fact
#     built yesterday still joins to a dimension rebuilt today. The natural key (<entity>_id)
#     is kept alongside for tracing back to the source.
#   - SCD Type 1: attributes show current values (a customer who moved shows the new city on
#     all their orders). Keeping history would be Type 2, see OLAP-901.
#   - Soft-deleted entities are kept and flagged: their past facts still need them.
#   - Dates are business dates in var reporting_timezone, via the to_reporting_date() macro.

models:
  - name: dim_date
    description: >
      One row per calendar day, 2020-01-01 to 2030-12-31. Facts join on their date column
      (e.g. fct_orders.order_date = dim_date.date_day) to group by month, quarter, weekday
      and so on with consistent definitions.
    columns:
      - name: date_day
        description: The calendar day. Primary key.
        data_tests: [unique, not_null]
      - name: day_of_week
        description: ISO weekday, 1 = Monday ... 7 = Sunday.
      - name: is_weekend
        description: Saturday or Sunday.

  - name: dim_customers
    description: One row per customer, including closed accounts (is_deleted).
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [unique, not_null]
      - name: first_order_date
        description: Business date of the first non-cancelled order. NULL if the customer never ordered.
      - name: lifetime_orders
        description: Orders placed and not cancelled (pending included). Activity, not revenue.

  - name: dim_products
    description: One row per product, including discontinued ones.
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [unique, not_null]
      - name: current_unit_price
        description: Today's list price. The price actually paid is fct_order_items.unit_price.

  - name: dim_campaigns
    description: One row per marketing campaign, from its latest CSV delivery.
    columns:
      - name: campaign_key
        data_tests: [unique, not_null]
      - name: campaign_id
        data_tests: [unique, not_null]
      - name: has_valid_details
        description: False when marketing's budget or start date couldn't be read (see stg_campaigns).

  - name: fct_orders
    description: >
      One row per order placed, in any status. Revenue definition: status paid or shipped,
      and not soft-deleted. For revenue questions sum `revenue`, not `order_total`.
    columns:
      - name: order_id
        description: Natural key of the order (a degenerate dimension; there is no dim_orders).
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests: [not_null]
      - name: campaign_key
        description: NULL when the order isn't attributed to a campaign.
      - name: order_date
        description: Business date of the order in var reporting_timezone. Joins dim_date.date_day.
        data_tests: [not_null]
      - name: is_revenue
        description: True when the order counts as revenue (paid or shipped, not soft-deleted).
      - name: line_count
        description: Number of order lines (distinct products).
      - name: item_count
        description: Total units across all lines.
      - name: order_total
        description: Amount of the order as recorded by the app, whatever its status.
      - name: revenue
        description: order_total when is_revenue, otherwise 0. Additive; sum it freely.

  - name: fct_order_items
    description: >
      One row per order line. Same process as fct_orders at a finer grain: use it for
      anything by product or category. Lines reconcile to fct_orders.order_total
      (tests/assert_order_totals_reconcile.sql).
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        description: The order this line belongs to (degenerate dimension). Joins fct_orders.
        data_tests: [not_null]
      - name: product_key
        data_tests: [not_null]
      - name: customer_key
        description: Inherited from the order. NULL would mean the line's order is missing.
        data_tests: [not_null]
      - name: order_date
        description: Business date of the order. Joins dim_date.date_day.
        data_tests: [not_null]
      - name: is_revenue
        description: True when the order counts as revenue and the line isn't soft-deleted.
      - name: unit_price
        description: Price actually paid per unit at order time (not dim_products.current_unit_price).
      - name: line_total
        description: quantity * unit_price, whatever the order's status.
      - name: revenue
        description: line_total when is_revenue, otherwise 0. Additive; sum it freely.

  - name: fct_payments
    description: >
      One row per payment received. Dated by when the money arrived (payment_date), not when
      the order was placed.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        description: The order paid for (degenerate dimension). Joins fct_orders.
        data_tests: [not_null]
      - name: customer_key
        description: The customer of the order paid for.
        data_tests: [not_null]
      - name: payment_date
        description: Business date the payment was received, in var reporting_timezone. Joins dim_date.date_day.
        data_tests: [not_null]
      - name: payment_method
        description: card, paypal or bank_transfer. Kept on the fact; too small for its own dimension.
      - name: amount
        description: Amount received. Additive.
